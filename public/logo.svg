<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="crestGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669" />
      <stop offset="1" stop-color="#10B981" />
    </linearGradient>
    <style>
      .bold-text { font-family: 'Satoshi', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 32px; fill: #064E3B; }
      .faint-text { font-family: 'Satoshi', system-ui, -apple-system, sans-serif; font-weight: 300; font-size: 32px; fill: #064E3B; opacity: 0.6; }
    </style>
  </defs>

  <!-- Logo Mark Squircle Badge -->
  <g transform="translate(8, 8)">
    <rect width="48" height="48" rx="14" fill="url(#crestGrad)" />
    
    <!-- Crown & Fork Crest -->
    <path d="M10 17L15.5 30H32.5L38 17L31.5 22L24 12L16.5 22L10 17Z" fill="#FFFFFF" />
    <!-- Fork tines cutouts inside crown -->
    <path d="M20.5 23.5V28.5M24 19.5V28.5M27.5 23.5V28.5" stroke="#059669" stroke-width="2.2" stroke-linecap="round" />
    <!-- Base dining dish curve -->
    <path d="M15 33.5C18 35.5 30 35.5 33 33.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <!-- Pinnacle Jewel / Star -->
    <circle cx="24" cy="8.5" r="2" fill="#FFFFFF" />
  </g>

  <!-- Wordmark -->
  <text x="68" y="42">
    <tspan class="bold-text">Crown</tspan>
    <tspan dx="2" class="faint-text">Canteen</tspan>
  </text>
</svg>
